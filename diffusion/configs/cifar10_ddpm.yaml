dataset:
  name: cifar10
  data_dir: ../data
  image_size: 32
  channels: 3
  batch_size: 128
  num_workers: 2
  download: true

diffusion:
  timesteps: 500
  beta_start: 0.0001
  beta_end: 0.02

model:
  base_channels: 64

training:
  epochs: 20
  learning_rate: 0.0002
  seed: 42

outputs:
  samples_dir: outputs/samples/cifar10
  checkpoints_dir: outputs/checkpoints/cifar10
  logs_dir: outputs/logs/cifar10
