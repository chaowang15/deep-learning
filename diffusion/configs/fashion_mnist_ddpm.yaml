dataset:
  name: fashion_mnist
  data_dir: ../data
  image_size: 28
  channels: 1
  batch_size: 128
  num_workers: 2
  download: true

diffusion:
  timesteps: 300
  beta_start: 0.0001
  beta_end: 0.02

model:
  base_channels: 48

training:
  epochs: 5
  learning_rate: 0.0002
  seed: 42

outputs:
  samples_dir: outputs/samples/fashion_mnist
  checkpoints_dir: outputs/checkpoints/fashion_mnist
  logs_dir: outputs/logs/fashion_mnist
