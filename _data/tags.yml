# Curated tag set for the homepage filter.
# Posts list their tags in front matter, e.g.  tags: [Diffusion, Sampling]
# Use the exact `name` below. Keep each post to 1-3 tags.
# To add a new tag: add an entry here (pick a group), then use it in a post.
# Groups control the section headings and chip colors in the tag panel.

groups:
  - id: basics
    label: "基础"
  - id: models
    label: "生成模型"
  - id: methods
    label: "方法与技巧"
  - id: apps
    label: "系统与应用"

